# The build server's web site on port 80 (installed by images/serve-artifacts.sh):
# the image files that images/build-image.sh publishes to /data2/airos/artifacts,
# under /images/, and the build dashboard (dashboard/server.py) for the rest.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    sendfile on;

    location /images/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
    location ~ ^/images/.*\.(xz|sha256)$ {
        types { }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
