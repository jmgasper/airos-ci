# The build server's download page for air/OS images (images/build-image.sh
# publishes to /data2/airos/artifacts). Installed by images/serve-artifacts.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    sendfile on;
    location ~ \.(xz|sha256|json)$ {
        types { }
        default_type application/octet-stream;
    }
}
