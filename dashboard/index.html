<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>air/OS builds</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #677085; --line: #e1e4ea;
  --accent: #2f6fdb; --accent-text: #ffffff; --ok: #1f8a4c; --bad: #c93a3a; --warn: #b7791f;
  --bar: #e8ecf3; --code: #0f1420; --code-text: #d7deea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151c; --card: #1a202a; --text: #e6e9ef; --muted: #9aa3b5; --line: #2a3240;
    --accent: #5b8ff0; --accent-text: #0d1117; --ok: #43c47a; --bad: #f06b6b; --warn: #e0a64a;
    --bar: #273041; --code: #0b0e14; --code-text: #cfd6e2;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between;
  padding: 18px 24px 8px; }
h1 { font-size: 22px; margin: 0; }
h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
.server { color: var(--muted); font-size: 13px; }
main { padding: 0 24px 32px; max-width: 1280px; margin: 0 auto; }
.controls { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 18px; }
.controls .label { font-weight: 600; margin-right: 6px; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
button.small { padding: 3px 10px; font-size: 13px; }
button.danger { color: var(--bad); border-color: var(--bad); }
label.clean { display: flex; gap: 6px; align-items: center; color: var(--muted); margin-left: auto; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex;
  flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 18px; margin: 0; }
.card .for { color: var(--muted); font-size: 13px; margin-top: 2px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.image a.download { font-weight: 600; color: var(--accent); text-decoration: none; word-break: break-all; }
.meta { color: var(--muted); font-size: 13px; }
.links a { color: var(--accent); font-size: 13px; margin-right: 10px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px;
  border: 1px solid currentColor; }
.badge.pass, .badge.done { color: var(--ok); }
.badge.fail, .badge.failed, .badge.interrupted { color: var(--bad); }
.badge.running, .badge.built { color: var(--accent); }
.badge.waiting, .badge.cancelled { color: var(--warn); }
.thumb { width: 100%; max-height: 170px; object-fit: cover; object-position: top; border-radius: 6px;
  border: 1px solid var(--line); cursor: zoom-in; }
.status { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.stage { font-weight: 600; }
.stage small { font-weight: 400; color: var(--muted); }
.bar { height: 14px; background: var(--bar); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
.bar.waiting > div { background: repeating-linear-gradient(45deg, var(--warn) 0 10px, transparent 10px 20px);
  width: 100% !important; opacity: .45; }
.numbers { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.numbers b { color: var(--text); font-weight: 600; }
.stages { display: flex; flex-wrap: wrap; gap: 4px; }
.stages span { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--bar); color: var(--muted); }
.stages span.now { background: var(--accent); color: var(--accent-text); }
.stages span.past::before { content: "✓ "; }
.older summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.older ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.older a { color: var(--accent); }
h3 { font-size: 16px; margin: 26px 0 10px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
#log { display: none; margin-top: 18px; }
#log pre { background: var(--code); color: var(--code-text); padding: 12px; border-radius: 10px; max-height: 420px;
  overflow: auto; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  word-break: break-all; }
#log .head { display: flex; gap: 10px; align-items: center; }
#message { min-height: 20px; color: var(--muted); font-size: 14px; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center;
  justify-content: center; padding: 20px; cursor: zoom-out; }
#zoom img { max-width: 100%; max-height: 100%; }
@media (max-width: 600px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  label.clean { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>air/OS builds <small>airos-build</small></h1>
  <div class="server" id="server"></div>
</header>
<main>
  <div class="controls">
    <span class="label">New build from the latest master:</span>
    <button class="primary" data-build="x86_64">x86_64</button>
    <button class="primary" data-build="arm64">ARM64 / EFI</button>
    <button class="primary" data-build="rpi4">Raspberry Pi</button>
    <button class="primary" data-build="all">All 3</button>
    <label class="clean"><input type="checkbox" id="clean"> Clean build (Haiku from scratch; much slower)</label>
  </div>
  <div id="message"></div>
  <div class="grid" id="targets"></div>
  <div id="log">
    <div class="head"><h3 id="log-title">Log</h3>
      <button class="small" id="log-close">Close</button></div>
    <pre id="log-text"></pre>
  </div>
  <h3>Recent builds</h3>
  <div class="table-wrap"><table>
    <thead><tr><th>Started</th><th>Image</th><th>From</th><th>Kind</th><th>Took</th><th>Result</th><th></th></tr></thead>
    <tbody id="recent"></tbody>
  </table></div>
</main>
<div id="zoom"><img alt=""></div>
<script>
const ORDER = ["x86_64", "arm64", "rpi4"];
const ORIGIN = {web: "dashboard", ci: "CI (GitHub)", shell: "shell"};
let state = null, logId = null;

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;",
  '"': "&quot;", "'": "&#39;"}[c]));
function duration(s) {
  if (s == null) return "–";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : m ? `${m} min ${String(sec).padStart(2, "0")} s` : `${sec} s`;
}
function clock(date) {
  return date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}
function when(iso) {
  if (!iso) return "–";
  const d = new Date(iso);
  const today = new Date().toDateString() === d.toDateString();
  return today ? clock(d) : d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + clock(d);
}
function size(bytes) {
  return bytes == null ? "" : bytes > 1e9 ? (bytes / 1e9).toFixed(2) + " GB" : Math.round(bytes / 1e6) + " MB";
}
function stateLabel(b) {
  if (b.state === "waiting") return "waiting";
  if (b.state === "running" && b.stage === "smoke test") return "smoke test";
  if (b.state === "built") return "smoke test";
  return b.state;
}

function renderStatus(name, t) {
  const b = t.current;
  if (!b || ["done", "failed", "cancelled"].includes(b.state)) {
    const usual = t.typical_seconds ? `A build usually takes ${duration(t.typical_seconds)}.` : "";
    return `<div class="status"><div class="meta">No build running. ${usual}</div></div>`;
  }
  const pct = Math.round((b.progress || 0) * 100);
  const waiting = b.state === "waiting";
  const stages = (b.stages || []).filter(s => !["queued", "done", "failed", "cancelled"].includes(s.name)
    && !s.name.startsWith("waiting"));
  const chips = stages.map((s, i) => `<span class="${i === stages.length - 1 ? "now" : "past"}">${esc(s.name)}</span>`).join("");
  const detail = (b.stages || []).slice(-1)[0]?.detail;
  let numbers = `<span>Elapsed <b>${duration(b.elapsed)}</b></span>`;
  if (!waiting && b.eta_seconds != null && b.state !== "interrupted") {
    const done = new Date(Date.now() + b.eta_seconds * 1000);
    numbers += `<span>About <b>${duration(b.eta_seconds)}</b> left (done around <b>${clock(done)}</b>)</span>`;
  }
  if (b.typical_seconds) numbers += `<span>Usually ${duration(b.typical_seconds)}${b.estimate_from_history ? "" : " (estimate)"}</span>`;
  if (b.jam) numbers += `<span>jam <b>${b.jam.done}</b> of ${b.jam.total} targets</span>`;
  numbers += `<span>From ${esc(ORIGIN[b.origin] || b.origin)}${b.clean ? ", clean build" : ""}</span>`;
  const cancel = b.origin === "web" && ["waiting", "running", "built"].includes(b.state)
    ? `<button class="small danger" data-cancel="${esc(b.id)}">Cancel</button>` : "";
  return `<div class="status">
    <div><span class="badge ${esc(b.state)}">${esc(stateLabel(b))}</span>
      <span class="stage">${esc(waiting ? "Waiting for the build server" : b.stage)}</span>
      ${detail ? `<small class="meta"> · ${esc(detail)}</small>` : ""}</div>
    <div class="bar ${waiting ? "waiting" : ""}"><div style="width:${pct}%"></div></div>
    <div class="numbers"><span><b>${waiting ? "queued" : pct + "%"}</b></span>${numbers}</div>
    ${b.note ? `<div class="meta">${esc(b.note)}</div>` : ""}
    ${waiting && (b.blocked_by || []).length ? `<div class="meta">In use by: ${b.blocked_by.map(j =>
      `${esc(j.what)} (${esc(j.where)})`).join(", ")}${(b.queue || []).length ? ` · also waiting: ${b.queue.map(j =>
      `${esc(j.what)} (${esc(j.where)})`).join(", ")}` : ""}</div>` : ""}
    <div class="stages">${chips}</div>
    <div><button class="small" data-log="${esc(b.id)}">Show log</button> ${cancel}</div>
  </div>`;
}

function renderImage(name, t) {
  const img = (t.images || [])[0];
  if (!img) return `<div class="meta">No image built yet.</div>`;
  const smoke = img.smoke ? `<span class="badge ${img.smoke}">smoke test ${img.smoke}</span>` : "";
  const older = (t.images || []).slice(1).map(o =>
    `<li><a href="${esc(o.url)}">${esc(o.stamp)}</a> · ${size(o.bytes)}${o.smoke ? " · " + o.smoke : ""}</li>`).join("");
  return `<div class="image">
    <div class="section-title">Latest image</div>
    <a class="download" href="${esc(img.url)}" download>${esc(img.image)}</a>
    <div class="meta">${size(img.bytes)} (xz; ${size(img.image_bytes)} written) · built ${when(img.built)} · ${esc(img.haiku || "")}</div>
    <div class="links" style="margin-top:4px">${smoke}
      ${img.sha256_url ? `<a href="${esc(img.sha256_url)}">SHA-256</a>` : ""}
      ${img.manifest_url ? `<a href="${esc(img.manifest_url)}">manifest</a>` : ""}
      <a href="/images/${esc(name)}/">all files</a></div>
    ${img.screen_url ? `<img class="thumb" src="${esc(img.screen_url)}" alt="The image's desktop in QEMU" data-zoom="${esc(img.screen_url)}" style="margin-top:8px">` : ""}
    ${older ? `<details class="older"><summary>Older images</summary><ul>${older}</ul></details>` : ""}
  </div>`;
}

function render() {
  if (!state) return;
  const s = state.server;
  $("#server").textContent = `load ${s.load.join(" / ")} on ${s.cpus} CPUs · ${s.disk_free_gb} GB free`;
  $("#targets").innerHTML = ORDER.map(name => {
    const t = state.targets[name];
    return `<section class="card"><div><h2>${esc(t.label)}</h2><div class="for">${esc(t.for)}</div></div>
      ${renderImage(name, t)}${renderStatus(name, t)}</section>`;
  }).join("");
  const busy = ORDER.filter(n => {
    const c = state.targets[n].current;
    return c && ["waiting", "running"].includes(c.state);
  });
  document.querySelectorAll("[data-build]").forEach(b => {
    const which = b.dataset.build;
    b.disabled = which === "all" ? busy.length === 3 : busy.includes(which);
  });
  $("#recent").innerHTML = state.recent.map(b => `<tr>
    <td>${when(b.started)}</td><td>${esc(state.targets[b.target]?.label || b.target)}</td>
    <td>${esc(ORIGIN[b.origin] || b.origin)}</td><td>${b.clean ? "clean" : "incremental"}</td>
    <td>${duration(b.active_elapsed || b.elapsed)}</td>
    <td><span class="badge ${esc(b.state)}">${esc(stateLabel(b))}${b.smoke ? " · smoke " + esc(b.smoke) : ""}</span></td>
    <td><button class="small" data-log="${esc(b.id)}">log</button></td></tr>`).join("") ||
    `<tr><td colspan="7" class="meta">No builds recorded yet.</td></tr>`;
}

async function refresh() {
  try {
    state = await (await fetch("/api/status")).json();
    render();
  } catch (e) {
    $("#server").textContent = "cannot reach the dashboard service";
  }
  if (logId) loadLog();
}

async function loadLog() {
  const text = await (await fetch(`/api/log?id=${encodeURIComponent(logId)}&lines=400`)).text();
  const pre = $("#log-text");
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  pre.textContent = text || "(nothing logged yet)";
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

async function build(which) {
  const targets = which === "all" ? ORDER : [which];
  const clean = $("#clean").checked;
  if (clean && !confirm(`Build ${targets.join(", ")} from scratch? Haiku is compiled again entirely, which takes much longer.`)) return;
  $("#message").textContent = "Starting…";
  const r = await (await fetch("/api/build", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({targets, clean})})).json();
  const started = (r.started || []).map(s => s.target).join(", ");
  const skipped = (r.skipped || []).map(s => `${s.target}: ${s.reason}`).join("; ");
  $("#message").textContent = r.error ? `Could not start: ${r.error}` :
    [started && `Started ${started}.`, skipped && `Skipped ${skipped}.`].filter(Boolean).join(" ");
  refresh();
}

async function cancel(id) {
  if (!confirm("Cancel this build?")) return;
  const r = await (await fetch("/api/cancel", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id})})).json();
  $("#message").textContent = r.error ? `Could not cancel: ${r.error}` : `Cancelled ${id}.`;
  refresh();
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.build) build(t.dataset.build);
  else if (t.dataset.cancel) cancel(t.dataset.cancel);
  else if (t.dataset.log) {
    logId = t.dataset.log;
    $("#log-title").textContent = `Log: ${logId}`;
    $("#log").style.display = "block";
    loadLog().then(() => { const pre = $("#log-text"); pre.scrollTop = pre.scrollHeight; });
    $("#log").scrollIntoView({behavior: "smooth"});
  } else if (t.id === "log-close") {
    logId = null;
    $("#log").style.display = "none";
  } else if (t.dataset.zoom) {
    $("#zoom img").src = t.dataset.zoom;
    $("#zoom").style.display = "flex";
  } else if (t.closest("#zoom")) {
    $("#zoom").style.display = "none";
  }
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
